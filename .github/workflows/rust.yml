name: Rust components
on:
  push:
    branches: ['main', 'fips-*']
  pull_request:
    branches: [ '*' ]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  caracal-ffi-header:
    if: github.repository_owner == 'aws'
    name: caracal-ffi C header drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust and Cargo
        uses: dtolnay/rust-toolchain@stable

      # The version is pinned in the script, since cbindgen output can change
      # between releases.
      - name: Install cbindgen
        run: |
          version="$(sed -n 's/^CBINDGEN_VERSION="\(.*\)"$/\1/p' util/generate_caracal_ffi_header.sh)"
          cargo install --locked cbindgen --version "${version}"

      - name: Check caracal_ffi.h matches the caracal-ffi crate
        run: ./util/generate_caracal_ffi_header.sh --check
