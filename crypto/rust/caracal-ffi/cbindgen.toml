# cbindgen configuration for include/caracal_ffi.h. Regenerate the header with
# util/generate_caracal_ffi_header.sh; CI fails if the committed copy is stale.

language = "C"
header = """
// Copyright Amazon.com Inc. or its affiliates. All Rights Reserved.
// SPDX-License-Identifier: Apache-2.0 OR ISC

// C declarations for the caracal-ffi crate (src/lib.rs). These are internal
// to libcrypto and only available when AWS-LC is configured with
// -DENABLE_RUST=ON, in which case AWSLC_RUST is defined."""
autogen_warning = "// Generated by cbindgen. Do not edit; run util/generate_caracal_ffi_header.sh."
include_guard = "OPENSSL_HEADER_CRYPTO_RUST_CARACAL_FFI_H"
cpp_compat = true
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
usize_is_size_t = true
documentation_style = "c99"
line_length = 80
tab_width = 2

[fn]
args = "auto"

[export]
# Runtime support (src/lib.rs `mod rt`), not API.
exclude = ["abort", "rust_eh_personality"]
